# CubeCam configuration. Missing keys fall back to defaults in config.py.

camera:
  enabled: true        # false = keyboard-only mode
  index: 0             # which webcam (0 = first)
  backend: auto        # auto | dshow | msmf | v4l2 | avfoundation | any
  width: 1280
  height: 720
  fps: 120             # requested; the camera will use the highest rate it supports
  fourcc: MJPG         # MJPG usually unlocks higher FPS on USB webcams
  mirror: true         # selfie view (zone coordinates refer to the mirrored image)

detection:
  backend: auto        # auto | legacy | tasks  (see README)
  model_path: models/hand_landmarker.task   # only used by the tasks backend
  hands_required: 2    # palms that must be inside the zone
  model_complexity: 0  # legacy backend: 0 = fastest, 1 = more accurate
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  process_width: 640   # frames are downscaled to this width for detection (speed)

# Start zone ("virtual stackmat") as fractions of the frame: x, y = top-left corner.
zone:
  x: 0.10
  y: 0.68
  w: 0.80
  h: 0.30

timer:
  hold_time: 0.3       # seconds hands must rest in the zone to arm the timer
  debounce: 0.05       # seconds a zone change must persist (filters tracking flicker)
  inspection: false    # WCA 15 s inspection (toggle at runtime with I)
  inspection_limit: 15
  dnf_limit: 17
  warnings: [8, 12]
  audio: true          # beep at inspection warnings

storage:
  path: solves.json

# Stage 2: cube face reading. Only runs while the timer is IDLE and nothing is in the start zone.
vision:
  enabled: true
  process_width: 640   # frames are downscaled to this width for face detection
  still_time: 0.3      # seconds the cube must be held still before colours are read
  auto_verify: true    # check the scramble automatically whenever a face is shown (toggle with V)
  calibration_path: calibration.json   # written by the C (calibrate) flow

# R toggles recording of solves (frames + timestamps + scramble + result) for training data.
dataset:
  path: datasets       # git-ignored
  jpeg_quality: 90
  max_queue: 120       # frames waiting to be written; beyond this frames are dropped, never the timer
  preroll: 0.5         # seconds of video kept from before inspection/solve start
  tail: 0.5            # seconds kept after the stop
  max_width: 0         # 0 = full camera resolution; e.g. 960 to save disk space

# Stage 3: move count, TPS and turning/pause timeline, measured during SOLVING from motion in the
# cube region (between your palms). Only small numbers are kept, never images.
motion:
  enabled: true
  crop: 128            # the cube region is analysed at crop x crop px
  roi_scale: 1.0       # cube region side = roi_scale x distance between the palm centres
  roi_dy: 0.0          # shift the region down (+) / up (-) by this fraction of its side
  default_roi: [0.5, 0.45, 0.40]   # x, y, size (fractions of the frame) until both hands are seen
  flow_preset: 1       # optical flow quality: 0 fastest, 1 fast, 2 medium
  save_features: practice   # practice | all | none: keep per-frame motion numbers (~2 KB/s) for re-analysis
  features_path: motion_data
  analysis: {}         # threshold overrides, e.g. {on: 0.15, rot_hi: 0.65} (see vision/motion_analysis.py)

# P toggles practice mode: perform a known sequence so measured counts can be checked against the truth.
practice:
  path: practice_data  # practice.json + features/*.npz (git-ignored)
  tempo: 1.0           # cued moves per second (+/- in practice mode); 0 = free pace
  lead_in: 2.0         # seconds after the start before the first cue
  metronome: false     # beep on every cue
  sequences: null      # your own list, e.g. ["(R U R' U')x6", "random"]; null = built-in list

ui:
  window_name: CubeCam
  keyboard_canvas: [1280, 720]   # window size when there is no camera
  show_debug: false              # toggle with H
